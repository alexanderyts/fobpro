<style>
/* Layout: editor workspace — footage and edit on the left, listing/brand/delivery controls on the right.

:root {

  --accent: #c9a86a; --accent-hi: #d8b97c; --accent-ink: #191409; --accent-wash: rgba(201,168,106,.12);
  --ok: #86ad87; --warn: #d3a24f; --err: #d8796a; --info: #8da7c4;
  --sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --serif: 'Cormorant Garamond', Cormorant, Georgia, serif;
  --r1: 3px; --r2: 5px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg-0); color: var(--text-0); }
body { font: 400 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.dim { color: var(--text-1); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px; min-height: 48px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg-0); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-0); }
.wordmark { display: flex; align-items: center; gap: 9px; }

.dot.ok { background: var(--ok); } .dot.busy { background: var(--accent); animation: pulse 1.4s infinite; } .dot.err { background: var(--err); }
@keyframes pulse { 50% { opacity: .35; } }

.ws { display: grid; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
.main { padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 22px; min-width: 0; }
.side { border-left: 1px solid var(--line); background: var(--bg-1); min-height: calc(100vh - 48px); padding-bottom: 60px; padding-right: env(safe-area-inset-right, 0px); }

.head h1 { margin: 0; font: 600 32px/1.05 var(--serif); text-wrap: balance; }
.head .meta { color: var(--text-1); margin-top: 6px; display: flex; gap: 6px 14px; flex-wrap: wrap; }
.head { margin-bottom: 20px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.head .actions { margin-left: auto; display: flex; gap: 8px; }

.section { margin-bottom: 26px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: var(--r1); border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text-0); font-weight: 500; font-size: 12.5px; cursor: pointer; white-space: nowrap; }

.linkish { background: none; border: 0; padding: 0; color: var(--text-1); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }

.field { display: grid; gap: 5px; min-width: 0; }

.input, .select { height: 32px; width: 100%; padding: 0 10px; background: var(--bg-0); border: 1px solid var(--line-2); border-radius: var(--r1); color: var(--text-0); }
.input:focus, .select:focus { outline: none; border-color: var(--accent); }

.select.sm { height: 26px; font-size: 12px; padding-left: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1.6fr .7fr .9fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.hint { color: var(--text-2); font-size: 11.5px; line-height: 1.45; margin: 0; }
.hint.warn { color: var(--warn); }

.seg { display: inline-flex; background: var(--bg-0); border: 1px solid var(--line-2); border-radius: var(--r1); padding: 2px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: none; border: 0; background: transparent; color: var(--text-1); height: 24px; padding: 0 10px; border-radius: 2px; cursor: pointer; font-size: 12px; font-weight: 500; }

.seg.full { display: flex; } .seg.full button { flex: 1; }

.switch input:checked { background: var(--accent); }

.check input { margin: 2px 0 0; accent-color: var(--accent); }
.check .t { display: grid; gap: 1px; flex: 1; min-width: 0; }
.check b { font-weight: 500; } .check small { color: var(--text-2); }
.check:has(input:checked) { border-color: rgba(201,168,106,.45); background: var(--accent-wash); }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r1); cursor: pointer; background: var(--bg-0); }
.opt input { margin: 3px 0 0; accent-color: var(--accent); grid-row: span 2; }

.clip .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.clip .media img.fitc { object-fit: contain; }
.clip .n, .clip .dur, .clip .kind { position: absolute; background: rgba(10,10,9,.78); padding: 1px 5px; border-radius: 2px; }
.clip .n { top: 6px; left: 6px; } .clip .dur { bottom: 6px; right: 6px; } .clip .kind { bottom: 6px; left: 6px; font-size: 10.5px; color: var(--text-1); }

.tag { font-size: 11px; padding: 1px 6px; border-radius: 2px; background: var(--bg-3); color: var(--text-1); }
.tag.fix { color: #cbb68e; background: rgba(201,168,106,.1); } .tag.warn { color: var(--warn); background: rgba(211,162,79,.1); }

.bar { height: 3px; background: var(--bg-4); border-radius: 2px; overflow: hidden; width: 100%; }

.tl-stats b { color: var(--text-0); font-weight: 500; }
.timeline { position: relative; height: 82px; }
.tl-track { position: absolute; left: 0; right: 0; top: 16px; height: 50px; }
.tl-seg { position: absolute; top: 0; height: 50px; background: var(--bg-3) center / cover no-repeat; border-radius: 2px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.5); }
.tl-seg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.65)); }
.tl-seg span { position: absolute; left: 6px; bottom: 4px; z-index: 1; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 10px); }
.tl-seg.card { background: repeating-linear-gradient(-45deg, var(--bg-3) 0 6px, var(--bg-2) 6px 12px); } .tl-seg.card::after { display: none; }

.tl-title { position: absolute; top: 0; height: 12px; border-radius: 2px; background: rgba(201,168,106,.28); border-left: 2px solid var(--accent); font-size: 9.5px; line-height: 12px; padding-left: 5px; color: var(--accent-hi); white-space: nowrap; overflow: hidden; }
.tl-ruler { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; }

.side-sec { border-bottom: 1px solid var(--line); padding: 16px 18px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); }
.side-sec > h3, .side-sec > summary { margin: 0 0 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); display: flex; align-items: center; cursor: default; }
.side-sec > summary { cursor: pointer; list-style: none; margin-bottom: 0; }
.side-sec > summary::-webkit-details-marker { display: none; }
.side-sec[open] > summary { margin-bottom: 12px; }
.side-sec > summary::after { content: '+'; margin-left: auto; font-size: 14px; color: var(--text-2); }
.side-sec[open] > summary::after { content: '−'; }
.side-sec h3 .right, .side-sec summary .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.side-sec summary .right { margin-right: 10px; }

.music { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px; background: var(--bg-0); border: 1px solid var(--line); border-radius: var(--r1); }

.renders { display: grid; gap: 8px; margin-top: 12px; }

.logo-box img { max-width: 84px; max-height: 48px; }

.modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(8,8,7,.74); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(1040px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--bg-1); border: 1px solid var(--line-2); border-radius: var(--r2); box-shadow: 0 24px 60px rgba(0,0,0,.5); }

.modal-head h2 { margin: 0; font: 500 14px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script type="module">
// =====================================================================================
// Threshold — browser edition. Footage never leaves the computer: files are read,
// decoded, graded and encoded in this page with WebCodecs + WebGL (via Mediabunny).
// =====================================================================================
const MEDIABUNNY_URL = 'https://cdn.jsdelivr.net/npm/mediabunny@1.65.2/dist/bundles/mediabunny.min.mjs';
let MB = null;

// ---------------------------------------------------------------- domain constants

// ---------------------------------------------------------------- music
async function loadMusic(file) {

    const kind = VIDEO_RE.test(f.name) || f.type.startsWith('video/') ? 'video' : PHOTO_RE.test(f.name) || /^image\/(jpeg|png|webp)$/.test(f.type) ? 'photo' : null;

// ---------------------------------------------------------------- Claude room labels

  S.labelling = true; renderBinHead();
  try {
    const lim = await S.sample.limits().catch(() => null);
    const per = Math.max(1, Math.min(lim?.images?.maxCount || 8, 12));
    for (let i = 0; i < todo.length; i += per) {
      const batch = todo.slice(i, i + per);
      const images = batch.map((c) => dataURLToBlob(c.poster));
      const prompt = `You label shots from a real estate listing shoot so they can be ordered into a property tour.
There are ${batch.length} images, in order, numbered 0 to ${batch.length - 1}. Each is a frame from one clip or one listing photo.
Room values: ${ROOM_ORDER.join(', ')}. aerial = drone view; exterior = ground-level front/side of the house; outdoor = backyard, patio, pool; primary_bedroom / primary_bath only when it clearly is the main suite; detail = close-up of finishes; other if unclear.
Issues (only if clearly visible): ${Object.keys(ISSUES).join(', ')}.
Reply with only a JSON array of ${batch.length} objects in image order, like [{"i":0,"room":"kitchen","caption":"Island toward breakfast nook","issues":[]}]. caption: at most 6 plain words.`;
      const out = await S.sample.json(prompt, { images, modelTier: 'quick' });
      if (Array.isArray(out)) for (const r of out) {
        const c = batch[Number(r?.i)];
        if (!c || c.roomSource === 'manual') continue;
        if (ROOM_ORDER.includes(r.room) && !(c.isDrone && r.room !== 'aerial')) { c.room = r.room; c.roomSource = 'claude'; }
        if (typeof r.caption === 'string') c.caption = r.caption.slice(0, 60);
        c.issues = Array.isArray(r.issues) ? r.issues.filter((x) => ISSUES[x]) : [];
      }
    }
    if (!S.manualOrder) S.clips = autoOrder(S.clips);
    toast('Rooms labelled. Check them and change any that are wrong.');
  } catch (e) {
    const msg = { not_granted: 'Claude access was not allowed for this page.', rate_limited: 'Claude is busy or your usage limit was reached. Try again later.', images_unavailable: 'This view cannot send images to Claude.' }[e?.code] || "Couldn't label rooms this time. Set them from the dropdowns instead.";

}

    while ((job = [...S.renders].reverse().find((r) => r.status === 'queued'))) {
      job.status = 'rendering'; renderRenders(); renderEngine();
      try {
        const p = buildPlan(job.formatId);
        if (p.error) throw new Error(p.error);
        const t0 = performance.now();
        job.blob = await renderPlan(p, job);
        job.duration = p.total; job.status = 'done'; job.seconds = (performance.now() - t0) / 1000;
      } catch (e) {
        if (e?.name === 'AbortError') job.status = 'cancelled';
        else { job.status = 'error'; job.error = e?.message || String(e); console.error(e); }
      }
      renderRenders(); renderEngine();
    }
  } finally { renderBusy = false; }
}
function slug(s) { return String(s || 'listing').normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/[\s_]+/g, '-').slice(0, 60) || 'listing'; }
async function saveRender(r) {
  const f = FORMATS[r.formatId];
  const filename = `${slug(S.listing.line1)}_${slug(f.label)}_${f.aspect.replace(':', 'x')}${f.branded ? '' : '_unbranded'}.${S.caps.container}`;
  if (S.downloads) {
    try { await S.downloads.save({ filename, data: r.blob }); toast(`Saved ${filename}`); }
    catch (e) {
      if (e?.code === 'declined') return;
      toast(e?.code === 'host_unavailable' ? 'This app cannot save files. Open the artifact in a browser on a computer.' : e?.code === 'rate_limited' ? 'Another save is in progress. Try again in a moment.' : `Couldn't save the file (${e?.code || 'error'}).`, true);
    }
    return;
  }
  if (window.claude) { toast("Saving files isn't available in this view. Open the artifact on claude.ai in a desktop browser.", true); return; }
  // Outside Claude (local testing): an ordinary download link.
  const a = document.createElement('a'); a.href = URL.createObjectURL(r.blob); a.download = filename; document.body.append(a); a.click(); a.remove();
}
function watchRender(r) {
  const url = URL.createObjectURL(r.blob);
  const m = openModal(`<div class="modal-head"><h2>${esc(r.label)} · ${esc(r.sub)}</h2><div class="right"><button class="btn sm" data-save="${r.id}">${ICON.save} Save</button><button class="btn ghost" data-close aria-label="Close">${ICON.close}</button></div></div>
    <div class="modal-body" style="background:#000;padding:0"><video class="player" src="${url}" controls playsinline autoplay ${r.height > r.width ? 'style="max-height:78vh;width:auto;margin:0 auto"' : ''}></video><p class="hint" id="watch-err" hidden style="padding:16px">This view can't play the file inline. Save it to watch.</p></div>`, () => URL.revokeObjectURL(url));
  $('video', m).addEventListener('error', () => { $('#watch-err', m).hidden = false; $('video', m).hidden = true; });
  $('[data-save]', m).addEventListener('click', () => saveRender(r));
}

// ---------------------------------------------------------------- modal + inspector
function openModal(inner, onClose) {
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;
  const close = () => { back.remove(); document.removeEventListener('keydown', key); onClose?.(); };
  const key = (e) => { if (e.key === 'Escape') close(); };
  back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
  back.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', key);
  $('#modal-root').append(back);
  back.close = close;
  return back;
}
async function stillFor(c, t) {
  if (c.kind === 'photo') { const cv = new OffscreenCanvas(960, Math.round((960 * c.height) / c.width)); cv.getContext('2d').drawImage(c.bitmap, 0, 0, cv.width, cv.height); return cv; }
  const { track } = await openVideo(c.file);
  const sink = new MB.CanvasSink(track, { width: 960, height: Math.round((960 * c.height) / c.width), fit: 'fill' });
  const w = await sink.getCanvas(t);
  const cv = new OffscreenCanvas(w.canvas.width, w.canvas.height); cv.getContext('2d').drawImage(w.canvas, 0, 0); return cv;
}
function shakeGraph(c, tin, tout) {
  const env = c.motion?.envelope || [], rate = c.motion?.envelopeRate || 10, D = c.duration, W = 600, H = 64, max = Math.max(0.006, ...env);
  const pts = env.map((v, i) => `${((i / rate / D) * W).toFixed(1)},${(H - 4 - (v / max) * (H - 10)).toFixed(1)}`).join(' ');
  const x = (t) => ((t / D) * W).toFixed(1);
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Camera shake over time"><rect x="0" y="0" width="${x(tin)}" height="${H}" fill="rgba(0,0,0,0.55)"/><rect x="${x(tout)}" y="0" width="${W - x(tout)}" height="${H}" fill="rgba(0,0,0,0.55)"/><polyline points="${pts}" fill="none" stroke="#c9a86a" stroke-width="1.2" vector-effect="non-scaling-stroke"/><line x1="${x(tin)}" x2="${x(tin)}" y1="0" y2="${H}" stroke="#ecebe5" vector-effect="non-scaling-stroke"/><line x1="${x(tout)}" x2="${x(tout)}" y1="0" y2="${H}" stroke="#ecebe5" vector-effect="non-scaling-stroke"/></svg>`;
}
async function openInspector(id) {
  const c = S.clips.find((x) => x.id === id);
  if (!c || c.status !== 'ready') return;
  const video = c.kind === 'video';
  const tin = video ? (c.trimIn ?? c.autoIn) : 0, tout = video ? (c.trimOut ?? c.autoOut) : 0;
  const strength = c.gradeStrength ?? (video ? S.settings.gradeStrength : 0);
  const m = openModal(`<div class="modal-head"><h2>${esc(c.name)}</h2>${c.caption ? `<span class="muted">${esc(c.caption)}</span>` : ''}<div class="right"><button class="btn ghost" data-close aria-label="Close">${ICON.close}</button></div></div>
    <div class="modal-body"><div class="insp">
      <div>
        <div class="compare" style="--split:50%" id="cmp"><span class="lbl l caps">Camera</span><span class="lbl r caps">Corrected</span><div class="handle"></div><input type="range" min="0" max="100" value="50" aria-label="Compare position"></div>
        ${video ? `<div style="margin-top:16px"><div class="row" style="margin-bottom:6px"><span class="caps">Camera shake · usable range</span><span class="mono muted" style="margin-left:auto" id="trim-lbl">${timecode(tin)} → ${timecode(tout)} · ${(tout - tin).toFixed(1)} s</span></div>
          <div id="graph">${shakeGraph(c, tin, tout)}</div>
          <div class="grid2" style="margin-top:8px"><div class="field"><label class="row" for="tr-in">In <span class="mono muted" style="margin-left:auto">auto ${timecode(c.autoIn)}</span></label><input id="tr-in" type="range" min="0" max="${c.duration}" step="0.05" value="${tin}"></div><div class="field"><label class="row" for="tr-out">Out <span class="mono muted" style="margin-left:auto">auto ${timecode(c.autoOut)}</span></label><input id="tr-out" type="range" min="0" max="${c.duration}" step="0.05" value="${tout}"></div></div>
          <p class="hint" style="margin-top:8px">Shaky starts and stops are trimmed automatically; the edit uses the steadiest stretch inside this range. <button class="linkish" id="tr-reset">Reset to automatic</button></p></div>` : '<p class="hint" style="margin-top:12px">Photos get a slow push or pan in the film. Most delivered listing photos are already edited, so colour correction starts off for photos.</p>'}
      </div>
      <div class="stack">
        <label class="switch"><span class="t">Use in edit<small>Excluded files stay in the bin.</small></span><input type="checkbox" id="in-include" ${c.include ? 'checked' : ''}></label>
        <div class="field"><span class="label">Room</span>${roomSelect(c)}</div>
        <div class="field"><label class="row" for="in-gs">Colour correction <span class="mono muted" style="margin-left:auto" id="gs-v">${Math.round(strength * 100)}%</span></label><input id="in-gs" type="range" min="0" max="1" step="0.05" value="${strength}"></div>
        <dl class="kv">
          <dt>Resolution</dt><dd class="mono">${c.width}×${c.height}</dd>
          ${video ? `<dt>Frame rate</dt><dd class="mono">${(c.fps || 0).toFixed(c.fps % 1 ? 2 : 0)} fps</dd><dt>Codec</dt><dd class="mono">${esc((c.codec || '').toUpperCase())}${c.hdr ? ' · HDR' : ''}</dd><dt>Duration</dt><dd class="mono">${timecode(c.duration)}</dd><dt>Camera</dt><dd>${{ static: 'Locked off', forward: 'Moving forward', back: 'Pulling back' }[c.motion.direction] || `Moving ${c.motion.direction}`}</dd>` : ''}
          <dt>File size</dt><dd class="mono">${bytes(c.size)}</dd>
        </dl>
        <button class="btn ghost danger" id="in-remove" style="justify-self:start">Remove from listing</button>
        <p class="hint" id="rm-confirm" hidden>Remove ${esc(c.name)}? <button class="linkish" id="rm-yes">Remove</button> · <button class="linkish" id="rm-no">Keep</button></p>
      </div></div></div>`);
  const cmp = $('#cmp', m);
  const drawCompare = async () => {
    try {
      const t = video ? ((c.trimIn ?? c.autoIn) + (c.trimOut ?? c.autoOut)) / 2 : 0;
      const still = await stillFor(c, t);
      const ctx = still.getContext('2d', { willReadFrequently: true });
      const before = await canvasToDataURL(still, 0.86);
      const img = ctx.getImageData(0, 0, still.width, still.height);
      ctx.putImageData(applyGradeCPU(img, gradeFor(c)), 0, 0);
      const after = await canvasToDataURL(still, 0.86);
      $$('img', cmp).forEach((x) => x.remove());
      cmp.insertAdjacentHTML('afterbegin', `<img src="${before}" alt="Original frame"><img class="after" src="${after}" alt="Corrected frame">`);
    } catch (e) { console.error(e); }
  };
  drawCompare();
  $('input', cmp).addEventListener('input', (e) => cmp.style.setProperty('--split', `${e.target.value}%`));
  if (video) {
    const ri = $('#tr-in', m), ro = $('#tr-out', m);
    const read = () => { let i = +ri.value, o = +ro.value; if (o - i < 0.5) { if (document.activeElement === ri) i = Math.max(0, o - 0.5); else o = Math.min(c.duration, i + 0.5); } return [i, o]; };
    const live = () => { const [i, o] = read(); $('#graph', m).innerHTML = shakeGraph(c, i, o); $('#trim-lbl', m).textContent = `${timecode(i)} → ${timecode(o)} · ${(o - i).toFixed(1)} s`; };
    for (const r of [ri, ro]) { r.addEventListener('input', live); r.addEventListener('change', () => { const [i, o] = read(); c.trimIn = i; c.trimOut = o; renderBin(); refreshPlan(); }); }
    $('#tr-reset', m).addEventListener('click', () => { delete c.trimIn; delete c.trimOut; ri.value = c.autoIn; ro.value = c.autoOut; live(); renderBin(); refreshPlan(); });
  }
  $('#in-include', m).addEventListener('change', (e) => { c.include = e.target.checked; renderBin(); refreshPlan(); });
  $('[data-room]', m).addEventListener('change', (e) => { setRoom(c, e.target.value); });
  const gs = $('#in-gs', m);
  gs.addEventListener('input', () => { $('#gs-v', m).textContent = `${Math.round(gs.value * 100)}%`; });
  gs.addEventListener('change', () => { c.gradeStrength = +gs.value; renderBin(); drawCompare(); });
  $('#in-remove', m).addEventListener('click', () => { $('#rm-confirm', m).hidden = false; });
  $('#rm-no', m).addEventListener('click', () => { $('#rm-confirm', m).hidden = true; });
  $('#rm-yes', m).addEventListener('click', () => { S.clips = S.clips.filter((x) => x.id !== c.id); c.bitmap?.close?.(); m.close(); renderBin(); refreshPlan(); renderEngine(); });
}
function setRoom(c, room) {
  c.room = room || null; c.roomSource = 'manual';
  if (!S.manualOrder) S.clips = autoOrder(S.clips);
  renderBin(); refreshPlan();
}

// ---------------------------------------------------------------- events
function saveSettings() { store.set('ts.settings', { ...S.settings }); }
function bind() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    if (act === 'add') $('#file-input').click();
    else if (act === 'music') $('#music-input').click();
    else if (act === 'music-del') { S.music = null; renderSide(); refreshPlan(); }
    else if (act === 'logo') $('#logo-input').click();
    else if (act === 'logo-del') { S.brand.logo = null; store.set('ts.brand', S.brand); renderSide(); }
    else if (act === 'inspect') openInspector(id);
    else if (act === 'label') labelRooms();
    else if (act === 'auto-order') { S.manualOrder = false; S.clips = autoOrder(S.clips); renderBin(); refreshPlan(); }
    else if (act === 'tl-format') { S.previewFormat = id; refreshPlan(); }
    else if (act === 'render') queueRenders();
    else if (act === 'cancel') { const r = S.renders.find((x) => x.id === id); if (r) { if (r.status === 'queued') r.status = 'cancelled'; r.abort.abort(); renderRenders(); renderEngine(); } }
    else if (act === 'discard') { S.renders = S.renders.filter((x) => x.id !== id); renderRenders(); }
    else if (act === 'save') { const r = S.renders.find((x) => x.id === id); if (r) saveRender(r); }
    else if (act === 'watch') { const r = S.renders.find((x) => x.id === id); if (r) watchRender(r); }
    else if (act === 'set') { const v = b.dataset.val; S.settings[b.dataset.key] = /^\d+$/.test(v) ? Number(v) : v; saveSettings(); $$(`[data-act="set"][data-key="${b.dataset.key}"]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); renderBin(); refreshPlan(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('#side [data-room], #bin [data-room]')) { const c = S.clips.find((x) => x.id === t.dataset.room); if (c) setRoom(c, t.value); }
    else if (t.matches('[data-format]')) { S.settings.formats = $$('[data-format]').filter((x) => x.checked).map((x) => x.dataset.format); saveSettings(); renderHead(); renderRenders(); }
    else if (t.matches('[data-setting]')) { const v = t.value; S.settings[t.dataset.setting] = /^\d+$/.test(v) ? Number(v) : v; saveSettings(); refreshPlan(); }
    else if (t.matches('[data-toggle]')) { S.settings[t.dataset.toggle] = t.checked; saveSettings(); renderBin(); refreshPlan(); }
    else if (t.id === 'file-input') { addFiles(t.files); t.value = ''; }
    else if (t.id === 'music-input' && t.files[0]) { addMusic(t.files[0]); t.value = ''; }
    else if (t.id === 'logo-input' && t.files[0]) {
      const fr = new FileReader();
      fr.onload = async () => {
        try { const img = new Image(); img.src = fr.result; await img.decode(); const s = Math.min(1, 600 / img.width, 300 / img.height); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); S.brand.logo = c.toDataURL('image/png'); store.set('ts.brand', S.brand); renderSide(); }
        catch { toast("Couldn't read that image.", true); }
      };
      fr.readAsDataURL(t.files[0]); t.value = '';
    }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.matches('[data-listing]')) { S.listing[t.dataset.listing] = t.value; S.listingIsExample = false; $('#listing-sec .eg')?.remove(); store.set('ts.listing', S.listing); renderHead(); refreshPlan(); }
    else if (t.matches('[data-brand]')) { S.brand[t.dataset.brand] = t.value; refreshPlan(); if (t.dataset.brand === 'accentColor' && /^#[0-9a-f]{6}$/i.test(t.value)) $('#b-accent-pick').value = t.value; store.set('ts.brand', S.brand); }
    else if (t.id === 'b-accent-pick') { S.brand.accentColor = t.value; $('#b-accent').value = t.value; store.set('ts.brand', S.brand); }
    else if (t.id === 's-strength') { S.settings.gradeStrength = +t.value; $('#s-strength-v').textContent = `${Math.round(t.value * 100)}%`; saveSettings(); }
  });
  document.addEventListener('change', (e) => { if (e.target.matches('[data-listing="label"]')) { renderHead(); refreshPlan(); } });
  // Drag and drop: files from the desktop anywhere; clip cards to reorder.
  let dragId = null;
  document.addEventListener('dragstart', (e) => { const card = e.target.closest?.('[data-clip]'); if (!card) return; dragId = card.dataset.clip; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
  document.addEventListener('dragend', () => { dragId = null; $$('.clip').forEach((c) => c.classList.remove('drop-before', 'drop-after')); });
  const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
  document.addEventListener('dragover', (e) => {
    if (hasFiles(e)) { e.preventDefault(); $('#drop, #bin.bin')?.classList.add('over'); return; }
    if (!dragId) return;
    const card = e.target.closest('[data-clip]'); if (!card || card.dataset.clip === dragId) return;
    e.preventDefault();
    const r = card.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
    $$('.clip').forEach((c) => c.classList.remove('drop-before', 'drop-after'));
    card.classList.add(after ? 'drop-after' : 'drop-before');
  });
  document.addEventListener('dragleave', (e) => { if (hasFiles(e) && !e.relatedTarget) $$('.over').forEach((x) => x.classList.remove('over')); });
  document.addEventListener('drop', (e) => {
    $$('.over').forEach((x) => x.classList.remove('over'));
    if (hasFiles(e)) { e.preventDefault(); addFiles(e.dataTransfer.files); return; }
    if (!dragId) return;
    const card = e.target.closest('[data-clip]'); if (!card) return;
    e.preventDefault();
    const after = card.classList.contains('drop-after');
    const moving = S.clips.find((c) => c.id === dragId);
    const rest = S.clips.filter((c) => c.id !== dragId);
    rest.splice(rest.findIndex((c) => c.id === card.dataset.clip) + (after ? 1 : 0), 0, moving);
    S.clips = rest; S.manualOrder = true; renderBin(); refreshPlan();
  });
}

// ---------------------------------------------------------------- boot
function renderAll() { renderBin(); renderSide(); refreshPlan(); renderEngine(); }
function shell() {
  $('#main').innerHTML = `<div class="head" id="head"></div>
    <section class="section"><div class="sec-head"><h2>Footage</h2><span class="note" id="bin-note"></span><div class="right" id="bin-actions"></div></div><div id="bin"></div></section>
    <section class="section"><div class="sec-head"><h2>Edit</h2><span class="note">Built from your footage and settings; updates as you change them.</span><div class="right" id="tl-formats"></div></div><div id="timeline"></div></section>`;
}
shell(); bind(); renderAll();
try {
  MB = await import(MEDIABUNNY_URL);
  await detectCaps();
} catch (e) {
  console.error(e);
  S.caps.ok = false; S.caps.problem = "The video engine couldn't load. Reload the page; if it keeps failing, open it in a current Chrome, Edge or Safari.";
  MB = MB || {};
}
renderAll();
// Optional platform features: saving files, and labelling rooms with Claude.
if (window.claude?.use) {
  window.claude.use('downloads').then((d) => { S.downloads = d; }).catch(() => {});
  window.claude.use('sample').then(async (s) => {
    if (!s) return;
    const lim = await s.limits().catch(() => null);
    if (lim?.images) { S.sample = s; renderBinHead(); }
  }).catch(() => {});
}
window.__threshold = S;
</script>
