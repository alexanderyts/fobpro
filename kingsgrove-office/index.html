<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingsgrove Sports Opening</title>
<!--
  Kingsgrove Sports, in the style of a mockumentary sitcom opening (28 s, 1920x1080, 30 fps).
  Every frame is a pure function of time: OFFICE.renderAt(t). render.cjs captures it frame by frame.
-->
<style>
@font-face { font-family: 'Inter'; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 700; src: url(fonts/nunito-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 900; src: url(fonts/nunito-latin-900-normal.woff2) format('woff2'); }
@font-face { font-family: 'Bebas Neue'; font-weight: 400; src: url(fonts/bebas-neue-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Special Elite'; font-weight: 400; src: url(fonts/special-elite-latin-400-normal.woff2) format('woff2'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #000; overflow: hidden; }
#frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#grade { position: absolute; inset: 0; filter: saturate(.84) contrast(.93) brightness(1.03); }
.shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; overflow: hidden; }
#tint { position: absolute; inset: 0; background: rgba(150, 205, 180, .10); mix-blend-mode: soft-light; pointer-events: none; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.32) 100%); pointer-events: none; }
#noise { position: absolute; inset: -64px; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
#credit { position: absolute; left: 118px; top: 900px; font: 500 46px Inter; color: #fff; letter-spacing: .01em;
  text-shadow: 0 2px 8px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.5); opacity: 0; white-space: nowrap; }
#title { position: absolute; inset: 0; background: #000; display: none; }
#label { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%); background: #f4f2ec; padding: 26px 58px 30px;
  font: 400 88px 'Special Elite'; color: #111; letter-spacing: .01em; box-shadow: 0 6px 24px rgba(255,255,255,.08); white-space: nowrap; }
#url { position: absolute; left: 0; right: 0; top: 690px; text-align: center; font: 500 26px Inter; color: #9a9a9a; letter-spacing: .08em; opacity: 0; }
</style>
</head>
<body>
<div id="frame">
  <div id="grade"></div>
  <div id="tint"></div>
  <div id="vig"></div>
  <canvas id="noise" width="2048" height="1208"></canvas>
  <div id="credit"></div>
  <div id="title"><div id="label">kingsgrove sports</div><div id="url">kingsgrovesports.com.au</div></div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="ballG" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#e45a4c"/><stop offset=".55" stop-color="#b3261e"/><stop offset="1" stop-color="#6e120d"/></radialGradient>
    <symbol id="ball" viewBox="-50 -50 100 100">
      <circle r="48" fill="url(#ballG)"/>
      <path d="M-20-44C-4-18-4 18-20 44M-6-47C12-18 12 18-6 47" fill="none" stroke="#f6e7cc" stroke-width="3"/>
      <path d="M-27-40C-10-16-10 16-27 40M1-46C20-18 20 18 1 46" fill="none" stroke="#f6e7cc" stroke-width="5" stroke-dasharray="2 6" stroke-linecap="round"/>
      <ellipse cx="-18" cy="-22" rx="14" ry="9" fill="#fff" opacity=".22" transform="rotate(-30 -18 -22)"/>
    </symbol>
    <symbol id="mug" viewBox="0 0 76 80">
      <path d="M58 26C78 26 78 60 58 60" fill="none" stroke="currentColor" stroke-width="9"/>
      <rect x="4" y="12" width="56" height="66" rx="10" fill="currentColor"/>
      <rect x="4" y="12" width="56" height="66" rx="10" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="3"/>
      <ellipse cx="32" cy="15" rx="25" ry="5.5" fill="#3e2518"/>

    <!-- vertical bat, handle up, 80 x 520 -->
    <symbol id="bat" viewBox="0 0 80 520">
      <rect x="31" y="0" width="18" height="170" rx="9" fill="#1b1b1b"/>
      <g fill="#c0392b"><rect x="31" y="14" width="18" height="10"/><rect x="31" y="44" width="18" height="10"/><rect x="31" y="74" width="18" height="10"/><rect x="31" y="104" width="18" height="10"/><rect x="31" y="134" width="18" height="10"/></g>
      <path d="M12 168Q40 150 68 168L70 488Q70 518 40 518Q10 518 10 488Z" fill="#ecd8a6" stroke="#c4a870" stroke-width="3"/>
      <rect x="20" y="208" width="40" height="150" rx="7" fill="var(--st, #17603a)"/>
      <rect x="26" y="222" width="28" height="6" rx="3" fill="#e9b949"/>
      <rect x="26" y="336" width="28" height="6" rx="3" fill="#e9b949"/>
    </symbol>
    <filter id="mblur" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="14 0"/></filter>
    <filter id="mblur2" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="5 0"/></filter>

<script>
(() => {
const DURATION = 28, FPS = 30;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: p => 1 - Math.pow(1 - p, 3), in: p => p * p * p,
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, ez] = keys[i];
    if (t <= t1) { const [t0, v0] = keys[i - 1]; return t1 === t0 ? v1 : lerp(v0, v1, (ez || E.io)((t - t0) / (t1 - t0))); }
  }
  return keys[keys.length - 1][1];
}
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const $ = id => document.getElementById(id);
const pulse = (t, at, len) => { const p = (t - at) / len; return p < 0 || p > 1 ? 0 : Math.sin(p * Math.PI); };

// ================================================================ character rig
const OUT = '#5a3a26';
function person(id, o) {
  const P = s => `${id}-${s}`;
  const arms = {
    typing: `<g id="${P('armL')}"><line x1="176" y1="606" x2="252" y2="700" stroke="${o.skin}" stroke-width="46" stroke-linecap="round"/><path d="M188 470C150 490 130 548 140 612L216 624C210 580 212 530 228 492Z" fill="${o.sleeve}"/></g>
             <g id="${P('armR')}"><line x1="524" y1="606" x2="448" y2="700" stroke="${o.skin}" stroke-width="46" stroke-linecap="round"/><path d="M512 470C550 490 570 548 560 612L484 624C490 580 488 530 472 492Z" fill="${o.sleeve}"/></g>`,
    holding: `<g id="${P('armL')}"><path d="M188 470C150 490 130 548 140 612L216 624C210 580 212 530 228 492Z" fill="${o.sleeve}"/><line x1="178" y1="610" x2="318" y2="600" stroke="${o.skin}" stroke-width="46" stroke-linecap="round"/></g>
              <g id="${P('armR')}"><path d="M512 470C550 490 570 548 560 612L484 624C490 580 488 530 472 492Z" fill="${o.sleeve}"/><line x1="522" y1="610" x2="382" y2="640" stroke="${o.skin}" stroke-width="46" stroke-linecap="round"/></g>`,
    none: '',
  }[o.arms || 'typing'];
  const hairBack = o.hair === 'bald'
    ? `<path d="M222 300C212 240 222 200 250 182L262 250Z" fill="${o.hairCol}"/><path d="M478 300C488 240 478 200 450 182L438 250Z" fill="${o.hairCol}"/>`
    : `<ellipse cx="350" cy="202" rx="140" ry="118" fill="${o.hairCol}"/>`;
  const fringe = o.hair === 'bald'
    ? `<ellipse cx="318" cy="150" rx="46" ry="18" fill="#fff" opacity=".28" transform="rotate(-18 318 150)"/>`
    : `<path d="M232 234C226 150 280 106 350 104C420 106 474 150 468 234C452 190 428 172 404 166C392 188 368 194 346 180C330 198 300 200 286 176C262 188 244 206 232 234Z" fill="${o.hairCol}"/>`;
  const headset = o.headset ? `
    <path d="M216 270C205 60 495 60 484 270" fill="none" stroke="#2b2f3a" stroke-width="14"/>
    <rect x="203" y="238" width="32" height="66" rx="14" fill="#2b2f3a"/><rect x="465" y="238" width="32" height="66" rx="14" fill="#2b2f3a"/>
    <rect x="209" y="254" width="6" height="34" rx="3" fill="#2e9e5b"/><rect x="485" y="254" width="6" height="34" rx="3" fill="#2e9e5b"/>
    <path d="M219 294Q230 372 312 374" fill="none" stroke="#2b2f3a" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="318" cy="374" rx="13" ry="10" fill="#3b4150"/>` : '';
  const shades = o.shades ? `
    <g transform="translate(0 -6)"><path d="M262 150Q268 128 300 130Q332 132 334 152Q330 170 300 170Q266 170 262 150Z" fill="#1d2330"/>
    <path d="M366 152Q368 132 400 130Q432 128 438 150Q434 170 400 170Q370 170 366 152Z" fill="#1d2330"/>
    <path d="M334 146Q350 138 366 146" fill="none" stroke="#1d2330" stroke-width="6"/>
    <path d="M272 142Q286 136 298 138" stroke="#7fa7d8" stroke-width="4" fill="none" opacity=".6"/></g>` : '';
  const stache = o.stache ? `<path d="M296 332Q322 312 350 324Q378 312 404 332Q392 348 368 342Q352 338 350 332Q348 338 332 342Q308 348 296 332Z" fill="${o.stacheCol || o.hairCol}"/>` : '';
  const eye = (side, cx) => `
    <g id="${P('eye' + side)}">
      <clipPath id="${P('clip' + side)}"><ellipse cx="${cx}" cy="262" rx="25" ry="29"/></clipPath>
      <g clip-path="url(#${P('clip' + side)})">
        <ellipse cx="${cx}" cy="262" rx="25" ry="29" fill="#fff"/>
        <g id="${P('pup' + side)}"><circle cx="${cx}" cy="262" r="12.5" fill="#2a1c14"/><circle cx="${cx + 4.5}" cy="256.5" r="4.4" fill="#fff"/></g>
        <rect id="${P('lid' + side)}" x="${cx - 30}" y="231" width="60" height="0" fill="${o.skin}"/>
      </g>
      <ellipse cx="${cx}" cy="262" rx="25" ry="29" fill="none" stroke="${OUT}" stroke-width="3.5"/>
    </g>`;
  return `
  <g id="${P('body')}">
    ${o.chair ? '<rect x="165" y="382" width="370" height="430" rx="58" fill="#2a2f3d"/><rect x="186" y="398" width="328" height="56" rx="28" fill="#363c4e"/>' : ''}
    <path d="M140 800L150 540C155 488 200 455 262 446L438 446C500 455 545 488 550 540L560 800Z" fill="${o.shirt}"/>
    ${o.trim ? `<path d="M205 462C230 452 250 448 262 446M495 462C470 452 450 448 438 446" stroke="${o.trim}" stroke-width="5" fill="none" stroke-linecap="round"/>` : ''}
    <rect x="318" y="356" width="64" height="100" rx="24" fill="${o.shade}"/>
    <path d="M310 446L350 508L390 446Z" fill="${o.shade}"/>
    <path d="M298 440L350 508L335 516L282 462Z" fill="${o.collar}"/><path d="M402 440L350 508L365 516L418 462Z" fill="${o.collar}"/>
    ${o.logo ? '<use href="#ball" x="428" y="476" width="30" height="30"/>' : ''}
    ${arms}
  </g>
  <g id="${P('head')}">
    ${hairBack}
    <circle cx="229" cy="270" r="25" fill="${o.skin}" stroke="${OUT}" stroke-width="4"/>
    <circle cx="471" cy="270" r="25" fill="${o.skin}" stroke="${OUT}" stroke-width="4"/>
    <ellipse cx="350" cy="258" rx="${o.faceW || 122}" ry="136" fill="${o.skin}" stroke="${OUT}" stroke-width="4"/>
    ${eye('L', 302)}${eye('R', 398)}
    <path id="${P('browL')}" d="M272 214Q300 200 330 210" fill="none" stroke="${o.browCol || o.hairCol}" stroke-width="10" stroke-linecap="round"/>
    <path id="${P('browR')}" d="M370 210Q400 200 428 214" fill="none" stroke="${o.browCol || o.hairCol}" stroke-width="10" stroke-linecap="round"/>
    <path d="M345 284Q362 306 346 315" fill="none" stroke="${o.nose || '#98603b'}" stroke-width="4.5" stroke-linecap="round"/>
    <g id="${P('blush')}" opacity="0" fill="#f07f86"><ellipse cx="262" cy="322" rx="25" ry="12"/><ellipse cx="438" cy="322" rx="25" ry="12"/></g>
    <clipPath id="${P('mclip')}"><path id="${P('mclipP')}" d=""/></clipPath>
    <path id="${P('mouth')}" d="" fill="#6b1f24"/>
    <g clip-path="url(#${P('mclip')})"><ellipse id="${P('tongue')}" cx="350" cy="390" rx="28" ry="16" fill="#d8646a"/><rect id="${P('teeth')}" x="270" y="300" width="160" height="0" fill="#fff"/></g>
    <path id="${P('mline')}" d="" fill="none" stroke="${OUT}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${stache}
    ${fringe}${headset}${shades}
  </g>`;
}
function mouthPath(cx, cy, w, smile, open) {
  const cornerY = cy - smile * 14;
  const up = cy + smile * 14 - open * 26 * (1 - clamp(smile));
  const low = cy + smile * 14 + open * 64 + Math.max(0, smile) * open * 10;
  const a = cx - w / 3, b = cx + w / 3;
  return { d: `M${cx - w} ${cornerY}C${a} ${up} ${b} ${up} ${cx + w} ${cornerY}C${b} ${low} ${a} ${low} ${cx - w} ${cornerY}Z`, up, low, cornerY };
}
function pose(id, p) {
  const q = s => document.getElementById(`${id}-${s}`);
  const lx = p.lookX || 0, ly = p.lookY || 0;
  q('pupL').setAttribute('transform', `translate(${lx} ${ly})`);
  q('pupR').setAttribute('transform', `translate(${lx} ${ly})`);
  const lid = clamp(p.lid || 0.08);
  q('lidL').setAttribute('height', lid * 62); q('lidR').setAttribute('height', lid * 62);
  const br = p.browRaise || 0, bt = p.browTilt || 0;
  q('browL').setAttribute('transform', `translate(0 ${-br}) rotate(${-bt} 301 208)`);
  q('browR').setAttribute('transform', `translate(0 ${-(p.browRaiseR ?? br)}) rotate(${bt} 399 208)`);
  const m = mouthPath(350, 345 + (p.mouthY || 0), p.mw || 52, p.smile ?? 0.4, p.open || 0);
  q('mouth').setAttribute('d', m.d); q('mclipP').setAttribute('d', m.d); q('mline').setAttribute('d', m.d);
  q('teeth').setAttribute('y', Math.min(m.up, m.cornerY) - 30);
  q('teeth').setAttribute('height', Math.max(0, m.up + 12 - (Math.min(m.up, m.cornerY) - 30)) * clamp(p.smile ?? 0));
  q('tongue').setAttribute('cy', m.low - 4);
  q('blush').setAttribute('opacity', p.blush || 0);
  q('head').setAttribute('transform', `translate(${p.headX || 0} ${p.headY || 0}) rotate(${p.headRot || 0} 350 400)`);
  const bob = p.typing ? Math.sin(p.t * 38) * 4 : 0;
  if (q('armL')) q('armL').setAttribute('transform', `translate(0 ${bob})`);
  if (q('armR')) q('armR').setAttribute('transform', `translate(0 ${-bob})`);
  q('body').setAttribute('transform', `translate(0 ${p.bodyY || 0})`);
}
const NACK = { skin: '#c68a5c', shade: '#a86f45', hairCol: '#2a1c14', shirt: '#1f7a45', sleeve: '#1d7443', collar: '#f6efd9', trim: '#e9b949', headset: true, logo: true };
const DAVE = { skin: '#eab48c', shade: '#cf9571', hairCol: '#9b5b2c', browCol: '#8a4d22', hair: 'bald', shirt: '#2f6fb3', sleeve: '#2a64a3', collar: '#e8eef6', shades: true, stache: true, stacheCol: '#8a4d22', nose: '#c07a55', faceW: 128 };

// ================================================================ scenery helpers
const blink = (t, times) => Math.max(0, ...times.map(b => pulse(t, b, .16)));
function shopfront(x, w, name, awning, wall, sign) {
  const stripes = Array.from({ length: Math.ceil(w / 60) }, (_, i) => `<rect x="${x + i * 60}" y="440" width="30" height="60" fill="${awning}"/>`).join('');
  return `<g>
    <rect x="${x}" y="300" width="${w}" height="420" fill="${wall}"/>
    <rect x="${x}" y="300" width="${w}" height="16" fill="rgba(0,0,0,.12)"/>
    <rect x="${x + 30}" y="350" width="${w - 60}" height="80" rx="6" fill="${sign || '#2c3440'}"/>
    <text x="${x + w / 2}" y="406" text-anchor="middle" font-family="Bebas Neue" font-size="58" fill="#f4efe4" letter-spacing="4">${name}</text>
    <rect x="${x}" y="440" width="${w}" height="60" fill="#f1ede4"/>${stripes}
    <path d="M${x} 500Q${x + 15} 520 ${x + 30} 500" fill="${awning}"/>
    <rect x="${x + 40}" y="520" width="${w * 0.52}" height="190" fill="#9fb8c8" stroke="#3c4148" stroke-width="6"/>
    <rect x="${x + 40}" y="520" width="${w * 0.52}" height="190" fill="url(#glass)"/>
    <rect x="${x + w * 0.62 + 20}" y="520" width="${w * 0.3}" height="200" fill="#5a4a3c" stroke="#3c4148" stroke-width="6"/>
    <circle cx="${x + w * 0.62 + 40}" cy="620" r="5" fill="#d8c090"/>
  </g>`;
}

// ================================================================ shots
const SHOTS = [];
function addShot(id, a, b, svg, update, opt = {}) {
  const div = document.createElement('div');
  div.className = 'shot'; div.id = id;
  div.innerHTML = `<svg width="1920" height="1080" viewBox="0 0 1920 1080"><g class="cam">${svg}</g></svg>`;
  $('grade').appendChild(div);
  SHOTS.push({ id, a, b, div, cam: div.querySelector('.cam'), update, ...opt });
}

// ---- 1. drive-by down the high street
(() => {
  const shops = [
    shopfront(150, 520, 'CAFÉ', '#b03a2e', '#e9dcc4'),
    shopfront(700, 480, 'NEWSAGENCY', '#2c5d8a', '#d9d2c2'),
    shopfront(2020, 480, 'CHEMIST', '#2f8f5b', '#ece7dc'),
    shopfront(2530, 500, 'BAKERY', '#c7802c', '#e6d6bb'),
  ].join('');
  const trees = Array.from({ length: 14 }, (_, i) => {
    const x = i * 330 + (i % 3) * 40;
    return `<ellipse cx="${x}" cy="${300 - (i % 2) * 30}" rx="${120 + (i % 3) * 20}" ry="${100 + (i % 2) * 20}" fill="${i % 2 ? '#7e9a78' : '#8aa582'}"/>
            <rect x="${x - 60}" y="${260 + (i % 4) * 10}" width="${150 + (i % 3) * 40}" height="120" fill="${i % 2 ? '#b9b3a8' : '#c7c0b4'}"/>
            <path d="M${x - 70} ${262 + (i % 4) * 10}L${x + 15} ${200 + (i % 4) * 10}L${x + 100 + (i % 3) * 40} ${262 + (i % 4) * 10}Z" fill="#8c5a4a"/>`;
  }).join('');
  const poles = Array.from({ length: 9 }, (_, i) => `<rect x="${i * 820}" y="160" width="26" height="760" fill="#3d4148"/><rect x="${i * 820 + 10}" y="160" width="190" height="14" fill="#3d4148"/>
     <ellipse cx="${i * 820 + 190}" cy="176" rx="30" ry="10" fill="#e8e2c8"/>
     <ellipse cx="${i * 820 + 420}" cy="840" rx="150" ry="90" fill="#4f6b45"/>`).join('');
  const store = `<g>
    <rect x="3080" y="250" width="1480" height="470" fill="#efe6d6"/>
    <rect x="3080" y="250" width="1480" height="20" fill="rgba(0,0,0,.14)"/>
    <rect x="3140" y="300" width="1360" height="130" rx="10" fill="#17603a"/>
    <rect x="3150" y="310" width="1340" height="110" rx="8" fill="none" stroke="#e9b949" stroke-width="5"/>
    <text x="3820" y="398" text-anchor="middle" font-family="Bebas Neue" font-size="104" letter-spacing="10" fill="#f6efd9">KINGSGROVE SPORTS</text>
    <use href="#ball" x="3170" y="325" width="80" height="80"/><use href="#ball" x="4390" y="325" width="80" height="80"/>
    <rect x="3120" y="460" width="820" height="250" fill="#a9c0cf" stroke="#2c3238" stroke-width="8"/>
    <g opacity=".95"><use href="#bat" x="3200" y="470" width="44" height="240" style="--st:#1f4e8a"/><use href="#bat" x="3280" y="470" width="44" height="240"/><use href="#bat" x="3360" y="470" width="44" height="240" style="--st:#8a1f1f"/>
    <rect x="3480" y="600" width="200" height="110" fill="#e6dccb"/><use href="#ball" x="3500" y="560" width="50" height="50"/><use href="#ball" x="3560" y="560" width="50" height="50"/><use href="#ball" x="3530" y="520" width="50" height="50"/></g>
    <rect x="3120" y="460" width="820" height="250" fill="url(#glass)"/>
    <rect x="3990" y="460" width="240" height="260" fill="#2c3a32" stroke="#2c3238" stroke-width="8"/>
    <rect x="4270" y="460" width="260" height="250" fill="#a9c0cf" stroke="#2c3238" stroke-width="8"/>
    <rect x="4270" y="460" width="260" height="250" fill="url(#glass)"/>
  </g>`;
  const welcome = `<g>
    <rect x="1250" y="600" width="700" height="140" fill="#6f9660"/>
    <rect x="1330" y="430" width="16" height="250" fill="#6b5a44"/><rect x="1854" y="430" width="16" height="250" fill="#6b5a44"/>
    <rect x="1300" y="330" width="600" height="190" rx="14" fill="#1d5b3a" stroke="#f4efe4" stroke-width="8"/>
    <text x="1600" y="392" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="40" fill="#f4efe4">Welcome to</text>
    <text x="1600" y="470" text-anchor="middle" font-family="Bebas Neue" font-size="96" letter-spacing="8" fill="#f4efe4">KINGSGROVE</text>

      <rect x="95" y="150" width="20" height="90" fill="#6b5a44"/></g>
    ${svgBalls}
    <g id="hand4"><path d="M2200 640L1290 700" stroke="#2a64a3" stroke-width="120" stroke-linecap="round"/><circle cx="1196" cy="706" r="58" fill="#eab48c" stroke="#5a3a26" stroke-width="4"/></g>`;
  const taken = 4;   // bottom-right ball
  addShot('s4', 6.5, 8.0, svg, (tl, sh) => {
    const reach = E.out(seg(tl, 0.0, 0.35)), pull = E.io(seg(tl, 0.42, 0.62));
    const hx = lerp(900, 0, reach) + pull * 520;
    sh.cam.querySelector('#hand4').setAttribute('transform', `translate(${hx} 0)`);
    const t0 = 0.55;
    balls.forEach((b, j) => {
      const el = sh.cam.querySelector('#pb' + j);
      let x = b.x, y = b.y, rot = 0;
      if (j === taken) { x = b.x + pull * 520; y = b.y - pull * 10; }
      else {
        const start = t0 + (4 - b.k) * 0.025 + hash(j) * 0.05 + (b.k === 0 ? 0.08 : 0);
        const dt = Math.max(0, tl - start);
        if (dt > 0) {
          const vx = ((b.x - 1000) / 180 + (hash(j + 9) - 0.4) * 1.6) * 260 * (b.k === 0 ? 0.6 : 1);
          let yy = b.y + 0.5 * 2600 * dt * dt;
          const floor = 716;
          if (yy > floor) {
            const tHit = Math.sqrt(2 * (floor - b.y) / 2600) || 0;
            const vImp = 2600 * tHit, d2 = dt - tHit;
            yy = floor - Math.max(0, vImp * 0.3 * d2 - 0.5 * 2600 * d2 * d2);
          }
          x = b.x + vx * dt * Math.exp(-dt * 0.6);
          if (x < 370 || x > 1550) yy = Math.max(yy, floor + 0.5 * 2600 * Math.max(0, dt - 0.25) ** 2);
          y = yy; rot = (x - b.x) / R * 57;
        }
      }
      el.setAttribute('transform', `translate(${x} ${y}) rotate(${rot})`);
    });
  }, { shake: 4, hunt: true });
})();

// ================================================================ camera, credits, grade
function camTransform(sh, tl) {
  const s = sh.shake || 4, k = SHOTS.indexOf(sh) * 7.3;
  const n = (f, p) => Math.sin(tl * f + k + p);
  let dx = s * (n(1.3, 0) * 0.6 + n(2.9, 1) * 0.3 + n(7.1, 2) * (sh.fast ? 0.5 : 0.12));
  let dy = s * (n(1.1, 3) * 0.6 + n(3.3, 4) * 0.3 + n(6.7, 5) * (sh.fast ? 0.5 : 0.12)) + (sh.jolt || 0) + (sh.panY || 0);
  const rot = s * 0.05 * (n(0.9, 6) + 0.4 * n(2.3, 7));
  let z = sh.zoom ? kf(tl, sh.zoom) : 1;
  if (sh.zoomNow) z *= sh.zoomNow;
  const [fx, fy] = sh.focus || [960, 540];
  const base = 1.04;   // a little overscan so the shake never shows an edge
  return `translate(${960 + dx} ${540 + dy}) rotate(${rot}) scale(${base * z}) translate(${-960 + (960 - fx) * (1 - 1 / z)} ${-540 + (540 - fy) * (1 - 1 / z)})`;
}

let noiseTiles = null;
function renderAt(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  const inTitle = t >= 24.0;
  $('title').style.display = inTitle ? 'block' : 'none';
  let cur = null;
  SHOTS.forEach(sh => {
    const on = !inTitle && t >= sh.a && t < sh.b;
    sh.div.style.display = on ? 'block' : 'none';
    if (on) cur = sh;
  });
  $('credit').style.opacity = 0;
  if (cur) {
    const tl = t - cur.a;
    cur.jolt = 0; cur.panY = 0;
    cur.update(tl, cur);
    cur.cam.setAttribute('transform', camTransform(cur, tl));
    cur.div.style.filter = cur.hunt ? `blur(${(1 - E.out(seg(tl, 0, 0.3))) * 5 + pulse(tl, 0.12, 0.2) * 2}px)` : 'none';
    if (cur.credit) {
      const [txt, a, b] = cur.credit;
      $('credit').textContent = txt;
      $('credit').style.opacity = seg(tl, a, a + 0.12) * (1 - seg(tl, b - 0.12, b));
    }
  }
  $('url').style.opacity = seg(t, 25.6, 26.2);
  $('label').style.transform = `translate(-50%, -58%) scale(${1 + 0.012 * seg(t, 24, 28)})`;
  // grain: shift a pre-rendered noise canvas by a frame-seeded offset
  const f = Math.floor(t * FPS);
  $('noise').style.transform = `translate(${-Math.floor(hash(f) * 64)}px, ${-Math.floor(hash(f + 91) * 64)}px)`;
}

function buildNoise() {
  const c = $('noise'), x = c.getContext('2d');
  const img = x.createImageData(c.width, c.height);
  let s = 12345;
  for (let i = 0; i < img.data.length; i += 4) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const v = (s >> 16) & 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
}

function events() {
  const ev = [];
  SHOTS.forEach(s => ev.push({ t: s.a, type: 'cut', id: s.id }));
  ev.push({ t: 24.0, type: 'cut', id: 'title' });
  [0.28, 0.63, 0.98, 1.33].forEach(h => ev.push({ t: 5.0 + h, type: 'mallet' }));
  ev.push({ t: 6.5 + 0.55, type: 'balls' });
  ev.push({ t: 10.5 + 0.45, type: 'beep' }, { t: 10.5 + 0.5, type: 'printer', dur: 1.0 });
  ev.push({ t: 15.5 + 0.62, type: 'clink' });
  ev.push({ t: 21.5 + 0.6, type: 'buzz' }, { t: 21.5 + 1.6, type: 'carpass' });
  return ev;
}

window.OFFICE = { DURATION, FPS, renderAt, events };
buildNoise();
